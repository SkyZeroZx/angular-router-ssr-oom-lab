services:
  app:
    build: ./app
    command: ["node", "--max-old-space-size=${HEAP_MB:-256}", "dist/router-oom-e2e/server/server.mjs"]
    environment:
      SSR_ALLOWED_HOSTS: ${SSR_ALLOWED_HOSTS:-}
    expose:
      - "4000"
    mem_limit: ${CONTAINER_MEM_LIMIT:-1536m}
    restart: "no"
    networks: [lab]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  nginx:
    build: ./nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: "no"
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  control:
    profiles: ["test"]
    build: ./client
    command: ["node", "send.mjs"]
    environment:
      MODE: control
      HEAP_MB: ${HEAP_MB:-256}
      TARGET_URL: http://nginx:8080
    depends_on:
      nginx:
        condition: service_healthy
    networks: [lab]

  candidate:
    profiles: ["test"]
    build: ./client
    command: ["node", "send.mjs"]
    environment:
      MODE: candidate
      HEAP_MB: ${HEAP_MB:-256}
      TARGET_URL: http://nginx:8080
    depends_on:
      nginx:
        condition: service_healthy
    networks: [lab]

networks:
  lab: {}
