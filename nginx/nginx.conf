worker_processes auto;

events {
  worker_connections 1024;
}

http {
  log_format proxy '$remote_addr method=$request_method status=$status '
                   'protocol=$server_protocol request_length=$request_length upstream=$upstream_status '
                   'request_time=$request_time upstream_time=$upstream_response_time';

  access_log /dev/stdout proxy;
  error_log /dev/stderr notice;
  server_tokens off;

  # Keep Nginx's production default explicit. Each test path must fit inside
  # one 8 KiB request-line buffer; the test does not relax proxy limits.
  large_client_header_buffers 4 8k;

  upstream angular_ssr {
    server app:4000;
    keepalive 32;
  }

  server {
    listen 8080 default_server;
    http2 on;
    server_name _;

    location = /nginx-health {
      access_log off;
      return 204;
    }

    location / {
      proxy_pass http://angular_ssr;

      # Angular's Express server receives HTTP/1.1 over a reused upstream
      # connection, matching a typical Nginx reverse-proxy deployment.
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Replace rather than append the client-supplied value before Angular
      # trusts this header.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }
}
